name: Публикация справочника

# Публикация сайта справочника на GitHub Pages.
# Запускается только вручную (workflow_dispatch), чтобы приватный репозиторий
# не пытался публиковаться сам до отдельного решения автора.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Справочник лежит в docs/manual и ссылается на примеры как ../../samples/*.
      # Локально это ведёт в корень репозитория, но на сайте страницы находятся
      # в корне /Axiom/, и такой путь уводит выше корня (404). Поэтому в собранной
      # копии ссылки на примеры переписываются на страницы GitHub, где .axm
      # открывается как исходный код с подсветкой.
      - name: Собрать статический сайт справочника
        run: |
          mkdir -p site
          cp -R docs/manual/. site/
          rm -f site/AUTHORING.md site/README.md
          find site -name '*.html' -print0 | xargs -0 sed -i 's#\.\./\.\./samples/#https://github.com/softhitssofthits-dotcom/Axiom/blob/HEAD/samples/#g'
          touch site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          echo "Осталось ссылок ../../ в HTML: $(grep -rl '\.\./\.\./' site --include='*.html' | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
