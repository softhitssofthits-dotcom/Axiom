name: Проверка версий
on: [push, pull_request]
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/versioning.mjs check
      - name: Проверить повышение относительно исходной ревизии
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REVISION" ] || [ "$BASE_REVISION" = "0000000000000000000000000000000000000000" ]; then
            echo "Исходная ревизия не задана, проверка повышения пропущена."
          elif ! git cat-file -e "${BASE_REVISION}^{commit}" 2>/dev/null; then
            echo "Исходная ревизия $BASE_REVISION недоступна (вероятно, история переписана); проверка повышения пропущена."
          else
            node scripts/versioning.mjs check --base "$BASE_REVISION"
          fi
