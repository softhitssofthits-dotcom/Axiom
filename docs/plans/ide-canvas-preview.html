<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>программа.axm — CANVAS</title><style>*{box-sizing:border-box}body{margin:0;background:#101720;color:#dbe6f5;font:13px "Segoe UI",sans-serif;height:100dvh;display:grid;grid-template-rows:40px minmax(0,1fr) 30px}header,footer{display:flex;align-items:center;padding:0 16px;background:#1c2635}header{border-bottom:1px solid #354157}footer{color:#a8b7cb;font-size:12px;justify-content:space-between;gap:10px}main{display:flex;align-items:center;justify-content:center;min-height:0;padding:16px}canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:16/9;object-fit:contain}@media(max-width:500px){main{padding:4px}footer span:last-child{display:none}}</style><header>программа.axm · отдельное окно CANVAS</header><main><canvas width="1280" height="720" aria-label="Пример графического результата: прямоугольник и круг"></canvas></main><footer><span>1280 × 720 · макет графического результата</span><span>Размер окна можно изменять</span></footer><script>const c=document.querySelector('canvas'),x=c.getContext('2d');x.fillStyle='#142033';x.fillRect(0,0,1280,720);x.strokeStyle='#20334b';for(let i=0;i<1280;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,720);x.stroke();}for(let i=0;i<720;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(1280,i);x.stroke();}x.fillStyle='#3684d2';x.fillRect(130,170,600,320);x.strokeStyle='#e4efff';x.lineWidth=3;x.strokeRect(130,170,600,320);x.fillStyle='#edc381';x.beginPath();x.arc(970,330,130,0,Math.PI*2);x.fill();x.fillStyle='#e4efff';x.font='28px Segoe UI';x.fillText('Графический результат программы',130,590);x.fillStyle='#9bb1cd';x.font='20px Segoe UI';x.fillText('CANVAS · 1280 × 720',130,630);</script></html>
