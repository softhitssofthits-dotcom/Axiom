      - heading "Краткая шпаргалка" [level=1] [ref=e52]
      - paragraph [ref=e53]: "Краткая справка собирает опорные формы синтаксиса Axiom в одном месте: объявления, ввод и вывод, условия, циклы, процедуры, массивы и небольшую выборку встроенных функций для быстрого узнавания записи."
      - generic [ref=e54]:
        - heading "Основные группы синтаксиса" [level=2] [ref=e55]
        - list [ref=e56]:
          - listitem [ref=e57]:
            - code [ref=e58]: DIM
            - text: и
            - code [ref=e59]: CONST
            - text: вводят имена значений;
          - listitem [ref=e60]:
            - code [ref=e61]: PRINT
            - text: показывает результат, а
            - code [ref=e62]: INPUT
            - text: получает строку от пользователя;
          - listitem [ref=e63]:
            - code [ref=e64]: IF
            - text: ","
            - code [ref=e65]: SELECT CASE
            - text: ", циклы и вызовы процедур меняют обычный порядок выполнения;"
          - listitem [ref=e66]: встроенные функции возвращают готовые значения; подробные списки функций находятся в тематических разделах по строкам, числам, датам, файлам, массивам и регулярным выражениям.
      - generic [ref=e67]:
        - heading "Типы и объявления" [level=2] [ref=e68]
        - code [ref=e70]: DIM age AS INTEGER DIM price AS DOUBLE = 1.5 DIM title = "Пример" CONST APP_NAME AS STRING = "Demo"
      - generic [ref=e71]:
        - heading "Ввод и вывод" [level=2] [ref=e72]
        - code [ref=e74]: "PRINT \"Привет\" PRINT 10, 20 PRINT \"Имя: \"; \"Анна\" PRINT INPUT value INPUT \"Введите имя: \"; name INPUT x, y"
      - generic [ref=e75]:
        - heading "Условия" [level=2] [ref=e76]
        - code [ref=e78]: IF score >= 90 THEN PRINT "Отлично" ELSEIF score >= 70 THEN PRINT "Хорошо" ELSE PRINT "Нужно доработать" END IF SELECT CASE score CASE 1 PRINT "Минимум" CASE 2, 3 PRINT "Небольшое значение" CASE 10 TO 20 PRINT "Диапазон от 10 до 20" CASE IS > 100 PRINT "Больше ста" CASE ELSE PRINT "Другой случай" END SELECT
      - generic [ref=e79]:
        - heading "Циклы" [level=2] [ref=e80]
        - code [ref=e82]: FOR i = 1 TO 10 STEP 2 PRINT i NEXT WHILE total < 100 total = total + 10 END WHILE DO WHILE value <> 0 INPUT "Введите число"; value LOOP DO UNTIL ready = TRUE ready = CheckState() LOOP DO PRINT "Первый проход обязателен" LOOP WHILE keepRunning DO total = total + 1 LOOP UNTIL total >= 10 DO PRINT "Повторение до EXIT DO" EXIT DO LOOP
