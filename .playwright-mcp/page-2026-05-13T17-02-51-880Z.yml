      - generic [ref=e128]:
        - heading "Группы функций даты и времени" [level=2] [ref=e129]
        - paragraph [ref=e130]:
          - text: Для текущих значений используются
          - code [ref=e131]: DATE
          - text: ","
          - code [ref=e132]: TIME
          - text: ","
          - code [ref=e133]: NOW
          - text: и их UTC-варианты. Для сборки даты из чисел используются
          - code [ref=e134]: DATESERIAL
          - text: и
          - code [ref=e135]: TIMESERIAL
          - text: . Для чтения отдельных частей служат
          - code [ref=e136]: YEAR
          - text: ","
          - code [ref=e137]: MONTH
          - text: ","
          - code [ref=e138]: DAY
          - text: ","
          - code [ref=e139]: HOUR
          - text: и соседние функции. Для расчётов между датами используются
          - code [ref=e140]: DATEADD
          - text: ","
          - code [ref=e141]: DATEDIFF
          - text: и
          - code [ref=e142]: DATEPART
          - text: ", а для часовых поясов -"
          - code [ref=e143]: UTCOFFSET
          - text: ","
          - code [ref=e144]: TOUTC
          - text: и
          - code [ref=e145]: FROMUTC
          - text: .
