        - text: / Функции даты и времени
      - paragraph [ref=e97]: Встроенные функции
      - heading "Функции даты и времени" [level=1] [ref=e98]
      - paragraph [ref=e99]: Функции этого раздела работают со строковыми представлениями даты и времени в канонических форматах Axiom. Они позволяют получить текущее значение, собрать дату из частей, извлечь отдельные компоненты, выполнить календарную арифметику и перевести значение между часовыми поясами.
      - generic [ref=e100]:
        - heading "Канонические форматы" [level=2] [ref=e101]
        - list [ref=e102]:
          - listitem [ref=e103]:
            - text: "Дата:"
            - code [ref=e104]: yyyy-MM-dd
          - listitem [ref=e105]:
            - text: "Время:"
            - code [ref=e106]: HH:mm:ss
          - listitem [ref=e107]:
            - text: "Дата и время:"
            - code [ref=e108]: yyyy-MM-dd HH:mm:ss
        - paragraph [ref=e109]:
          - text: Именно такие строки принимают и возвращают функции этого раздела. Локальные формы вроде
          - code [ref=e110]: 20.04.2026
          - text: или сокращённое время вроде
          - code [ref=e111]: 14:05
          - text: здесь не используются.
      - generic [ref=e112]:
        - heading "Основные правила" [level=2] [ref=e113]
        - list [ref=e114]:
          - listitem [ref=e115]:
            - code [ref=e116]: DATE
            - text: ","
            - code [ref=e117]: TIME
            - text: и
            - code [ref=e118]: NOW
            - text: могут вызываться как без аргументов, так и с часовым поясом в квадратных скобках на соответствующих справочных страницах.
          - listitem [ref=e119]: Большинство функций этого раздела принимают строку и возвращают либо новую строку в каноническом формате, либо числовой или логический результат.
          - listitem [ref=e120]: Если строка даты или времени записана не в каноническом формате либо токен интервала не поддерживается, функция завершается диагностикой времени выполнения.
      - generic [ref=e121]:
