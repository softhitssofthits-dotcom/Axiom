      - paragraph [ref=e97]: Встроенные функции
      - heading "Числовые функции" [level=1] [ref=e98]
      - paragraph [ref=e99]: Числовые функции Axiom помогают преобразовывать данные, выполнять типовые вычисления, работать со случайными значениями, углами, корнями, логарифмами и разными способами округления. Для удобства они разбиты на несколько тематических страниц.
      - generic [ref=e100]:
        - heading "Группы числовых функций" [level=2] [ref=e101]
        - paragraph [ref=e102]:
          - text: "Числовые функции делятся по задаче: преобразование между числом и строкой, базовые вычисления, случайные значения, тригонометрия, корни, логарифмы и округление. Если нужно превратить текст в число, смотри"
          - code [ref=e103]: VAL
          - text: . Если нужно взять модуль, минимум или максимум, смотри базовые функции. Если нужно работать с углами, переходи к тригонометрии.
      - generic [ref=e104]:
        - heading "Тип результата и ошибки" [level=2] [ref=e105]
        - list [ref=e106]:
          - listitem [ref=e107]:
            - code [ref=e108]: RND()
            - text: вызывается без аргументов и возвращает
            - code [ref=e109]: DOUBLE
            - text: в диапазоне от
            - code [ref=e110]: "0"
            - text: включительно до
            - code [ref=e111]: "1"
            - text: не включительно.
          - listitem [ref=e112]:
            - code [ref=e113]: INT
            - text: возвращает результат именно в типе
            - code [ref=e114]: INTEGER
            - text: ", а"
            - code [ref=e115]: FLOOR
            - text: ","
            - code [ref=e116]: CEIL
            - text: ","
            - code [ref=e117]: ROUND
            - text: и
            - code [ref=e118]: FIX
            - text: обычно сохраняют числовой тип исходного аргумента.
          - listitem [ref=e119]:
            - text: Функции вроде
            - code [ref=e120]: SQR
            - text: ","
            - code [ref=e121]: LOG
            - text: ","
            - code [ref=e122]: ASIN
            - text: ","
            - code [ref=e123]: ACOS
            - text: и
            - code [ref=e124]: ATANH
            - text: имеют ограничения по области допустимых значений. Если аргумент не подходит, программа получает диагностику времени выполнения.
